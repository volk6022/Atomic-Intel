# SearXNG settings — production-инстанс для Atomic-Scraper-Service.
# Минимальный override: включаем JSON API, выключаем limiter, направляем
# исходящий трафик через pool из 20 socks5.
#
# Подтверждено прогонами в serp_experiment/REPORT_searxng.md (прогон 9):
#   VPN на хосте + этот pool + retries=2 в клиенте → 95.3% success.
#
# После правок: docker compose restart searxng

use_default_settings: true

general:
  debug: false
  instance_name: "atomic-scraper"
  enable_metrics: true

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  ban_time_on_fail: 5
  max_ban_time_on_fail: 120
  # !!! критично — JSON API доступен только если перечислен здесь
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  base_url: false
  # шумит на single-user инстансе → выключаем
  limiter: false
  public_instance: false
  # secret_key подставляется из env SEARXNG_SECRET (см. docker-compose.yml)
  secret_key: "atomic-scraper-do-not-use-in-prod"
  image_proxy: false
  http_protocol_version: "1.1"
  method: "GET"

ui:
  default_locale: "en"
  query_in_title: false
  default_theme: simple

# Per-request ротация через rotation-порт 823 (http). Каждый запрос —
# новый exit-IP: бан/мёртвый IP не залипает (sticky-пул 11000-11009 раньше
# держал выжженный IP 10 минут, и все ретраи били в него же). Замер
# 2026-06-12: ротация 7/10 живых (7 уникальных IP), sticky 5/10.
# ru+pl чередуются round-robin'ом; ретраи клиента
# (src/infrastructure/external_api/searxng_client.py) добивают остальное.
# Sticky-порты 11000-11099 остаются целиком скраперу (proxies.txt).

# Выход только российский. Замер 04.09 на шести живых запросах про агентства
# и студии: тот же запрос с американского экзита даёт другую выдачу — bing
# с него возвращал китайские страницы, — поэтому чередование стран убрано.
# Порт 823 — ротация: каждый запрос идёт с нового IP, выжженный не залипает.
outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
  useragent_suffix: ""
  pool_connections: 20
  pool_maxsize: 10
  enable_http2: false
  extra_proxy_timeout: 5
  # ВНИМАНИЕ: не хардкодить креды прокси в репозитории.
  # Заполняется при деплое из секрета/окружения (см. infra/searxng/README.md).
  # На проде файл помечен skip-worktree, поэтому pull его не затирает —
  # правку отсюда надо переносить на сервер руками.
  proxies:
    all://:
      - http://USER:PASS@proxy-host.example.com:823

# Набор выверен замером, а не взят из умолчаний. Из 63 движков общей категории
# включёнными были девять, и настоящих поисковиков среди них три. Считали не
# число ответов, а уникальные домены и их относимость: bing давал по десять
# результатов, и все китайские — счётчик поставил бы его вторым лучшим.
#
# Итог набора ниже: 202 результата и 180 уникальных доменов на шести запросах,
# 84% доменов российские.
engines:
  # Основа выдачи: 100 результатов из 202 в замере.
  - name: google cse
    disabled: false

  # Даёт то, чего нет у google cse: обзоры и каталоги (vc.ru, отраслевые
  # подборки) — страницы, где про агентство пишет кто-то посторонний.
  - name: duckduckgo web
    disabled: false

  # Яндекс единственный, кому российский резидентный адрес мешает: с него
  # приходит отказ за 0.26 с, с американского движок отвечает нормально.
  # Поэтому у него собственная сеть, вопреки общему правилу выше.
  - name: yandex
    disabled: false
    network:
      proxies:
        all://:
          - http://USER:PASS_US@proxy-host.example.com:823

  # Старый движок duckduckgo отвечает 202-челленджем на каждый запрос:
  # 160 отказов из 160 в замере. Его заменяет duckduckgo web.
  - name: duckduckgo
    disabled: true

  # Википедия и викиданные к поиску подрядчиков отношения не имеют, а
  # таймаут тянут на каждом запросе.
  - name: wikipedia
    disabled: true
  - name: wikidata
    disabled: true

  # Ни одного ответа на русскоязычные коммерческие запросы.
  - name: brave
    disabled: true
  - name: startpage
    disabled: true
